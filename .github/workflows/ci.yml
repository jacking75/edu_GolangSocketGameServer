name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    # 이 저장소는 gohipernetFake(공통 네트워크 라이브러리)와 5개의 독립된 서버 모듈로 구성되어 있고,
    # 각 디렉토리가 자기 자신의 go.mod를 가진 별도 모듈이다. 모듈별로 나눠서 빌드/vet/test한다.
    #
    # 참고: chatServer2는 NTELIB_LOG_INFO 등 이 저장소에 정의되지 않은 심볼을 참조하고 있어
    # 현재 상태로는 빌드가 실패한다(이번 리뷰/수정 범위 밖의 사전 존재 이슈). CI가 이를 그대로
    # 드러내는 것이 의도된 동작이다 — 아래 continue-on-error는 chatServer2에 한해서만 켜져 있다.
    strategy:
      fail-fast: false
      matrix:
        module:
          - gohipernetFake
          - echoServer
          - chatServer
          - chatServer2
          - chatServer_msgpack
          - baccaratServer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: go build
        working-directory: ${{ matrix.module }}
        continue-on-error: ${{ matrix.module == 'chatServer2' }}
        run: go build ./...

      - name: go vet
        working-directory: ${{ matrix.module }}
        continue-on-error: ${{ matrix.module == 'chatServer2' }}
        run: go vet ./...

      - name: go test
        working-directory: ${{ matrix.module }}
        continue-on-error: ${{ matrix.module == 'chatServer2' }}
        run: go test ./...

  lint:
    # golangci-lint 도입. 기존 코드에 정리되지 않은 경고가 많으므로 지금 당장 전부 통과시키는 것이
    # 목표가 아니라, 앞으로의 변경을 검토할 수 있는 도구를 배선해 두는 것이 목적이다. 그래서
    # 실패해도 워크플로우 전체를 막지 않도록 continue-on-error로 둔다.
    strategy:
      fail-fast: false
      matrix:
        module:
          - gohipernetFake
          - echoServer
          - chatServer
          - chatServer2
          - chatServer_msgpack
          - baccaratServer
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: ${{ matrix.module }}
          args: --timeout=5m --config=${{ github.workspace }}/.golangci.yml
